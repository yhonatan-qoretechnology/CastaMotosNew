      <span class="wash-wizard__step" data-step="3">3. Tus datos</span>
      <span class="wash-wizard__step" data-step="4">4. Confirmar</span>
    </div>

    <div id="wash-wizard-body"><p class="loading-state">Cargando…</p></div>
  </div>
</main>
