<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña — CASTAMOTO</title>
<script>
(function () {
  var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  document.write('<base href="' + (isLocal ? '/proyectos/castamotos/' : '/') + '">');
})();
</script>
<link rel="stylesheet" href="frontend/css/main.css?v=20260901o">
<link rel="icon" type="image/png" href="frontend/assets/img/logo.png">
<script src="frontend/js/theme-init.js?v=20260901o"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="app-header"></div>

<main class="container">
  <div class="modal" style="margin: 40px auto; max-width: 420px;">
    <div class="modal__header">
      <h2 class="modal__title" id="recover-title">Recuperar contraseña</h2>
    </div>

    <!-- Paso 1 (sin token en la URL): pedir el correo -->
    <form id="request-reset-form">
      <p style="color: var(--gris-texto); font-size: 0.85rem; margin: 0 0 14px;">
        Escribe tu correo y te enviaremos un enlace para restablecer tu contraseña.
      </p>
      <div class="form-group">
        <label for="request-reset-email">Correo</label>
        <input class="form-control" type="email" id="request-reset-email" required>
      </div>
      <div class="form-error" id="request-reset-error"></div>
      <button class="btn btn-primary btn-block" type="submit">Enviar instrucciones</button>
    </form>

    <!-- Paso 2 (con ?token= en la URL): definir la nueva contraseña -->
    <form id="do-reset-form" hidden>
      <div class="form-group">
        <label for="do-reset-password">Nueva contraseña</label>
        <div class="password-field">
          <input class="form-control" type="password" id="do-reset-password" minlength="8" required>
          <button type="button" class="password-toggle" data-target="do-reset-password" aria-label="Mostrar contraseña"></button>
        </div>
      </div>
      <div class="form-group">
        <label for="do-reset-password-confirmation">Confirmar contraseña</label>
        <div class="password-field">
          <input class="form-control" type="password" id="do-reset-password-confirmation" minlength="8" required>
          <button type="button" class="password-toggle" data-target="do-reset-password-confirmation" aria-label="Mostrar contraseña"></button>
        </div>
      </div>
      <div class="form-error" id="do-reset-error"></div>
      <button class="btn btn-primary btn-block" type="submit">Restablecer contraseña</button>
    </form>

    <!-- Confirmación final -->
    <div id="recover-success" hidden>
      <p style="color: var(--exito); font-size: 0.9rem;" id="recover-success-message"></p>
      <a class="btn btn-primary btn-block" href=".">Ir al inicio</a>
    </div>
  </div>
</main>

<div id="app-footer"></div>

<script src="frontend/js/i18n.js?v=20260901o"></script>
<script src="frontend/js/utils/helpers.js?v=20260901o"></script>
<script src="frontend/js/services/apiService.js?v=20260901o"></script>
<script src="frontend/js/services/authService.js?v=20260901o"></script>
<script src="frontend/js/services/catalogService.js?v=20260901o"></script>
<script src="frontend/js/services/cartService.js?v=20260901o"></script>
<script src="frontend/js/services/themeService.js?v=20260901o"></script>
<script src="frontend/js/services/settingsService.js?v=20260901o"></script>
<script src="frontend/js/services/notificationService.js?v=20260901o"></script>
<script src="frontend/js/components/layout.js?v=20260901o"></script>
<script src="frontend/js/pages/recuperar-password.js?v=20260901o"></script>
</body>
</html>
