<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos — CASTAMOTO</title>
<!-- El sitio puede vivir en la raíz del dominio (producción, castamotos.com)
     o bajo un subdirectorio (desarrollo local, /proyectos/castamotos/) — en vez de
     un <base href> fijo que hay que recordar cambiar en 9 archivos cada vez que
     cambia el despliegue, se calcula solo según el host. document.write() es
     intencional acá: corre durante el parseo del HTML, ANTES que <link>/<script src>
     de más abajo intenten resolver rutas relativas, que es justo lo que <base> necesita. -->
<script>
(function () {
  var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  document.write('<base href="' + (isLocal ? '/proyectos/castamotos/' : '/') + '">');
})();
</script>
<link rel="stylesheet" href="frontend/css/main.css?v=20260823j">
<link rel="icon" type="image/png" href="frontend/assets/img/logo.png">
<script src="frontend/js/theme-init.js?v=20260823j"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="app-header"></div>

<main class="container">
  <nav class="breadcrumbs" aria-label="Ruta de navegación">
    <a href=".">Inicio</a> › <span aria-current="page">Productos</span>
  </nav>

  <div class="catalog-layout mt-16">
    <aside class="filters-sidebar">
      <h2>Filtrar</h2>
      <form id="filter-search-form" class="form-group">
        <label class="sr-only" for="filter-search-input">Buscar</label>
        <input class="form-control" id="filter-search-input" type="search" placeholder="Buscar en productos...">
      </form>
      <div class="form-group">
        <label for="filter-category">Categoría</label>
        <select id="filter-category" class="form-control"><option value="">Todas</option></select>
      </div>
      <div class="form-group">
        <label for="filter-brand">Marca</label>
        <select id="filter-brand" class="form-control"><option value="">Todas</option></select>
      </div>
      <div class="form-group">
        <label>Precio</label>
        <div class="flex gap-8">
          <input id="filter-min-price" class="form-control" type="number" placeholder="Mín.">
          <input id="filter-max-price" class="form-control" type="number" placeholder="Máx.">
        </div>
      </div>
      <div class="form-group">
        <label for="filter-availability">Disponibilidad</label>
        <select id="filter-availability" class="form-control">
          <option value="">Cualquiera</option>
          <option value="disponible">Disponible</option>
          <option value="ultimas_unidades">Últimas unidades</option>
          <option value="agotado">Agotado</option>
        </select>
      </div>
      <button class="btn btn-primary btn-block" id="apply-filters-btn">Aplicar filtros</button>
    </aside>

    <div>
      <h1 id="products-page-title" class="section__title" style="font-size:1.2rem;margin-top:0;">Productos</h1>
      <div class="flex-between mb-16" style="flex-wrap:wrap;gap:10px;">
        <p id="products-count" style="color:var(--gris-texto);font-size:0.85rem;margin:0;"></p>
        <select id="filter-sort" class="form-control" style="width:auto;" aria-label="Ordenar por">
          <option value="newest">Más recientes</option>
          <option value="relevancia">Relevancia</option>
          <option value="price_asc">Precio: menor a mayor</option>
          <option value="price_desc">Precio: mayor a menor</option>
          <option value="name">Nombre A-Z</option>
          <option value="rating">Mejor calificados</option>
        </select>
      </div>

      <div id="products-results"><p class="loading-state">Cargando productos…</p></div>
      <div class="text-center mt-16" id="products-pagination"></div>
    </div>
  </div>
</main>

<div id="app-footer"></div>

<script src="frontend/js/i18n.js?v=20260823j"></script>
<script src="frontend/js/utils/helpers.js?v=20260823j"></script>
<script src="frontend/js/services/apiService.js?v=20260823j"></script>
<script src="frontend/js/services/authService.js?v=20260823j"></script>
<script src="frontend/js/services/catalogService.js?v=20260823j"></script>
<script src="frontend/js/services/cartService.js?v=20260823j"></script>
<script src="frontend/js/services/themeService.js?v=20260823j"></script>
<script src="frontend/js/services/settingsService.js?v=20260823j"></script>
<script src="frontend/js/services/notificationService.js?v=20260823j"></script>
<script src="frontend/js/components/layout.js?v=20260823j"></script>
<script src="frontend/js/components/cards.js?v=20260823j"></script>
<script src="frontend/js/pages/productos.js?v=20260823j"></script>
</body>
</html>
