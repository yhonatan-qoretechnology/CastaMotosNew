<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil — CASTAMOTO</title>
<script>
(function () {
  var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  document.write('<base href="' + (isLocal ? '/proyectos/castamotos/' : '/') + '">');
})();
</script>
<link rel="stylesheet" href="frontend/css/main.css?v=20260822a">
<link rel="icon" type="image/png" href="frontend/assets/img/logo.png">
<script src="frontend/js/theme-init.js?v=20260822a"></script>
</head>
<body>

<div id="app-header"></div>

<main class="container">
  <h1 class="section__title mt-16">Mi perfil</h1>

  <div id="profile-mount">
    <div class="detail-grid">
      <div>
        <div class="purchase-box">
          <h2 style="font-size:1rem;margin-top:0;">Mi foto</h2>
          <div class="profile-avatar-row">
            <img id="profile-avatar-preview" class="profile-avatar" alt="Foto de perfil" hidden>
            <div id="profile-avatar-placeholder" class="profile-avatar profile-avatar--placeholder">🙂</div>
            <div>
              <label class="btn btn-secondary" for="profile-avatar-input" style="cursor:pointer;">Cambiar foto</label>
              <input type="file" id="profile-avatar-input" accept="image/*" hidden>
              <div class="form-error" id="profile-avatar-error"></div>
            </div>
          </div>
        </div>

        <form id="profile-form" class="purchase-box mt-16">
          <h2 style="font-size:1rem;margin-top:0;">Mis datos</h2>
          <div class="form-group">
            <label for="profile-email">Correo</label>
            <input class="form-control" id="profile-email" disabled>
          </div>
          <div class="form-row">
            <div class="form-group"><label for="profile-name">Nombre</label><input class="form-control" id="profile-name" required></div>
            <div class="form-group"><label for="profile-last-name">Apellido</label><input class="form-control" id="profile-last-name" required></div>
          </div>
          <div class="form-group">
            <label for="profile-phone">Teléfono</label>
            <input class="form-control" id="profile-phone">
          </div>
          <div class="form-error" id="profile-form-error"></div>
          <button class="btn btn-primary" type="submit">Guardar cambios</button>
        </form>
      </div>

      <div>
        <form id="change-password-form" class="purchase-box">
          <h2 style="font-size:1rem;margin-top:0;">Cambiar contraseña</h2>
          <div class="form-group">
            <label for="current-password">Contraseña actual</label>
            <div class="password-field">
              <input class="form-control" type="password" id="current-password" required>
              <button type="button" class="password-toggle" data-target="current-password" aria-label="Mostrar contraseña"></button>
            </div>
          </div>
          <div class="form-group">
            <label for="new-password">Contraseña nueva</label>
            <div class="password-field">
              <input class="form-control" type="password" id="new-password" minlength="8" required>
              <button type="button" class="password-toggle" data-target="new-password" aria-label="Mostrar contraseña"></button>
            </div>
          </div>
          <div class="form-group">
            <label for="new-password-confirmation">Confirmar contraseña nueva</label>
            <div class="password-field">
              <input class="form-control" type="password" id="new-password-confirmation" minlength="8" required>
              <button type="button" class="password-toggle" data-target="new-password-confirmation" aria-label="Mostrar contraseña"></button>
            </div>
          </div>
          <div class="form-error" id="password-form-error"></div>
          <button class="btn btn-secondary" type="submit">Actualizar contraseña</button>
        </form>

        <div class="purchase-box mt-16">
          <h2 style="font-size:1rem;margin-top:0;">Accesos rápidos</h2>
          <p style="margin:0 0 8px;"><a href="pedidos">📦 Mis pedidos</a></p>
          <p style="margin:0 0 8px;"><a href="favoritos">♥ Mis favoritos</a></p>
          <p style="margin:0 0 8px;"><a href="carrito">🛒 Mi carrito</a></p>
          <p style="margin:0;color:var(--gris-texto);font-size:0.82rem;">Las direcciones de entrega se agregan/editan durante el checkout.</p>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="app-footer"></div>

<script src="frontend/js/i18n.js?v=20260822a"></script>
<script src="frontend/js/utils/helpers.js?v=20260822a"></script>
<script src="frontend/js/services/apiService.js?v=20260822a"></script>
<script src="frontend/js/services/authService.js?v=20260822a"></script>
<script src="frontend/js/services/catalogService.js?v=20260822a"></script>
<script src="frontend/js/services/cartService.js?v=20260822a"></script>
<script src="frontend/js/services/themeService.js?v=20260822a"></script>
<script src="frontend/js/services/settingsService.js?v=20260822a"></script>
<script src="frontend/js/services/notificationService.js?v=20260822a"></script>
<script src="frontend/js/components/layout.js?v=20260822a"></script>
<script src="frontend/js/pages/perfil.js?v=20260822a"></script>
</body>
</html>
